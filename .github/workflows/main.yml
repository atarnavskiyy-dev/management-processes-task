name: DevOps Processes Task

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run the script to check
        run: |
          bash -e ./processes.sh&
          bash -e ./processes.sh&
          sleep 20s
          cat /proc/loadavg
          bash -e .github/test.sh 
